apiVersion: v1
kind: Secret
metadata:
  name: wp-db-secrets
  namespace: wordpress
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
  KUPA_DB_USER: "${KUPA_DB_USER}"
  KUPA_DB_PASSWORD: "${KUPA_DB_PASSWORD}"
  PERSONAL_DB_USER: "${PERSONAL_DB_USER}"
  PERSONAL_DB_PASSWORD: "${PERSONAL_DB_PASSWORD}"
  WP_ADMIN_USERNAME: "${WP_ADMIN_USERNAME}"
  WP_ADMIN_PASSWORD: "${WP_ADMIN_PASSWORD}"
---
# Seed SQL ConfigMap (creates separate databases and users for kupa & personal)
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-seed
  namespace: wordpress
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS `kupa` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    CREATE DATABASE IF NOT EXISTS `personal` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;

    CREATE USER IF NOT EXISTS '${KUPA_DB_USER}'@'%' IDENTIFIED BY '${KUPA_DB_PASSWORD}';
    ALTER USER '${KUPA_DB_USER}'@'%' IDENTIFIED BY '${KUPA_DB_PASSWORD}';
    GRANT ALL PRIVILEGES ON `kupa`.* TO '${KUPA_DB_USER}'@'%';

    CREATE USER IF NOT EXISTS '${PERSONAL_DB_USER}'@'%' IDENTIFIED BY '${PERSONAL_DB_PASSWORD}';
    ALTER USER '${PERSONAL_DB_USER}'@'%' IDENTIFIED BY '${PERSONAL_DB_PASSWORD}';
    GRANT ALL PRIVILEGES ON `personal`.* TO '${PERSONAL_DB_USER}'@'%';

    FLUSH PRIVILEGES;
