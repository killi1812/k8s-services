apiVersion: v1
kind: Secret
metadata:
  name: wp-db-secrets
  namespace: wordpress
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
  MYSQL_USER: "${MYSQL_USER}"
  MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
  WP_ADMIN_USERNAME: "${WP_ADMIN_USERNAME}"
  WP_ADMIN_PASSWORD: "${WP_ADMIN_PASSWORD}"
