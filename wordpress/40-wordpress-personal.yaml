# 1. PersistentVolumeClaim for wordpress-personal (/var/www/html/wp-content)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wp-personal-pvc
  namespace: wordpress
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
# 2. Deployment for wordpress-personal
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress-personal
  namespace: wordpress
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wordpress-personal
  template:
    metadata:
      labels:
        app: wordpress-personal
    spec:
      containers:
        - name: wordpress
          image: wordpress:latest
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          env:
            - name: WORDPRESS_DB_HOST
              value: "db:3306"
            - name: WORDPRESS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: wp-db-secrets
                  key: PERSONAL_DB_USER
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wp-db-secrets
                  key: PERSONAL_DB_PASSWORD
            - name: WORDPRESS_DB_NAME
              value: "personal"
            - name: WORDPRESS_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: wp-db-secrets
                  key: WP_ADMIN_USERNAME
            - name: WORDPRESS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wp-db-secrets
                  key: WP_ADMIN_PASSWORD
            - name: WORDPRESS_ADMIN_EMAIL
              value: "cvok.fran@gmail.com"
            - name: WORDPRESS_URL
              value: "https://home.francvok.from.hr"
            - name: WORDPRESS_TITLE
              value: "My Portfolio"
            # Prevent redirect loops behind Cloudflare Tunnel / Traefik HTTP reverse proxy
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                if (isset($_SERVER['HTTP_X_FORWARDED_PROTO']) && $_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
                    $_SERVER['HTTPS'] = 'on';
                }
          volumeMounts:
            - name: wp-content
              mountPath: /var/www/html/wp-content
      volumes:
        - name: wp-content
          persistentVolumeClaim:
            claimName: wp-personal-pvc
---
# 3. Internal Service for wordpress-personal
apiVersion: v1
kind: Service
metadata:
  name: wordpress-personal-svc
  namespace: wordpress
spec:
  selector:
    app: wordpress-personal
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
# 4. Traefik Ingress for home.francvok.from.hr
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wordpress-personal-ingress
  namespace: wordpress
spec:
  rules:
    - host: home.francvok.from.hr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wordpress-personal-svc
                port:
                  number: 80
