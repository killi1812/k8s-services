tunnel: ${CF_TUNNEL_ID}
credentials-file: /etc/cloudflared/creds/credentials.json

ingress:
  # Forward any *.francvok.from.hr subdomain and apex domain to K3s Traefik.
  # Traefik routes each request based on the Kubernetes Ingress `host:` rule.
  - hostname: "*.francvok.from.hr"
    service: http://traefik.kube-system.svc.cluster.local:80
  - hostname: francvok.from.hr
    service: http://traefik.kube-system.svc.cluster.local:80

  # Catch-all rule (required as the last entry)
  - service: http_status:404
